
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add/Edit Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <div class="container">
    <h2 id="formTitle">Add Employee</h2>
    <form id="employeeForm" class="mt-4">
      <div class="mb-3"><label class="form-label">Employee ID</label><input type="text" class="form-control" id="employeeId" required /></div>
      <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" id="name" required /></div>
      <div class="mb-3"><label class="form-label">Address</label><input type="text" class="form-control" id="address" /></div>
      <div class="mb-3"><label class="form-label">Department</label><input type="text" class="form-control" id="department" required /></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required /></div>
      <button type="submit" class="btn btn-success">Save</button>
      <a href="index.html" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const apiUrl = "http://localhost:5080/api/Employee";
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    function loadEmployeeForEdit(id) {
      $.get(`${apiUrl}/${id}`).done(emp => {
        $("#formTitle").text("Edit Employee");
        $("#employeeId").val(emp.employeeId).prop("disabled", true);
        $("#name").val(emp.name);
        $("#address").val(emp.address);
        $("#department").val(emp.department);
        $("#email").val(emp.email);
      }).fail(() => {
        alert("Employee not found.");
        window.location.href = "index.html";
      });
    }
    $(document).ready(() => {
      const id = getQueryParam("id");
      if (id) loadEmployeeForEdit(id);

      $("#employeeForm").submit(function (e) {
        e.preventDefault();
        const data = {
          employeeId: $("#employeeId").val(),
          name: $("#name").val(),
          address: $("#address").val(),
          department: $("#department").val(),
          email: $("#email").val()
        };
        if (id) {
          $.ajax({
            url: `${apiUrl}/${id}`,
            type: "DELETE",
            success: () => {
              $.ajax({
                url: apiUrl,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(data),
                success: () => window.location.href = "index.html",
                error: () => alert("Failed to save changes.")
              });
            },
            error: () => alert("Failed to update data.")
          });
        } else {
          $.ajax({
            url: apiUrl,
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),
            success: () => window.location.href = "index.html",
            error: (xhr) => {
              if (xhr.status === 400) alert(xhr.responseText || "Bad Request.");
              else alert("Failed to create employee.");
            }
          });
        }
      });
    });
  </script>
</body>
</html>
