
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <div class="container">
    <h2>Employee Detail</h2>
    <div id="employeeDetail" class="mt-4"></div>
    <a href="index.html" class="btn btn-secondary mt-3">Back to List</a>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const apiUrl = "http://localhost:5080/api/Employee";
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    function loadEmployeeDetail() {
      const id = getQueryParam("id");
      if (!id) {
        $("#employeeDetail").html("<div class='alert alert-danger'>No Employee ID provided.</div>");
        return;
      }
      $.get(`${apiUrl}/${id}`)
        .done(emp => {
          $("#employeeDetail").html(`
            <table class="table table-bordered">
              <tr><th>ID</th><td>${emp.employeeId}</td></tr>
              <tr><th>Name</th><td>${emp.name}</td></tr>
              <tr><th>Address</th><td>${emp.address}</td></tr>
              <tr><th>Department</th><td>${emp.department}</td></tr>
              <tr><th>Email</th><td>${emp.email}</td></tr>
            </table>
          `);
        })
        .fail(xhr => {
          if (xhr.status === 404) {
            $("#employeeDetail").html("<div class='alert alert-warning'>Employee not found.</div>");
          } else {
            $("#employeeDetail").html("<div class='alert alert-danger'>An error occurred.</div>");
          }
        });
    }
    $(document).ready(loadEmployeeDetail);
  </script>
</body>
</html>
