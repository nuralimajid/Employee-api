
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Employee List</h2>
    <a href="form.html" class="btn btn-success mb-3">Add New Employee</a>
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" id="searchName" class="form-control" placeholder="Search by Name">
      </div>
      <div class="col-md-4">
        <input type="text" id="searchDept" class="form-control" placeholder="Search by Department">
      </div>
      <div class="col-md-4">
        <button class="btn btn-primary" onclick="searchEmployees()">Search</button>
        <button class="btn btn-secondary" onclick="loadEmployees()">Reset</button>
      </div>
    </div>

    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>ID</th><th>Name</th><th>Department</th><th>Email</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="employeeTableBody"></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
